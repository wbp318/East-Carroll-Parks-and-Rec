name: Mermaid diagrams

on:
  push:
    paths: ["**/*.md", "scripts/check_mermaid.py", ".github/**"]
  pull_request:
    paths: ["**/*.md", "scripts/check_mermaid.py", ".github/**"]
  workflow_dispatch:

jobs:
  render:
    name: Render every mermaid block
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli@11

      - name: Static + render check
        run: python scripts/check_mermaid.py --render
